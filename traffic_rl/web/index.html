<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Flow · 强化学习实验台</title><link rel="stylesheet" href="styles/app.css"></head>
<body>
<header class="top"><a class="brand" href="#"><span class="brandmark">╋</span><span>Campus<span class="brand-light">Flow</span></span></a><nav aria-label="页面模式"><button id="demo-mode" class="tab active" aria-pressed="true">交通演示</button><button id="learn-mode" class="tab" aria-pressed="false">学习模式</button></nav><button class="secondary" id="guide-open">使用说明</button></header>
<main>
<section class="toolbar" aria-label="实验设置"><label class="layout-group field-label">道路结构<select id="layout" aria-label="道路结构"></select></label><div class="scenario-group"><span class="field-label">车流场景</span><div class="segments" id="scenarios"><button data-scenario="balanced" class="active">均衡车流</button><button data-scenario="peak">高峰车流</button><button data-scenario="tidal">潮汐车流</button></div></div><div class="policy-group"><label for="policy" class="field-label">控制策略</label><select id="policy"><option value="fixed">固定配时</option><option value="queue">排队优先</option></select></div><button class="text-button" id="info-open">实验信息 ↗</button></section>
<div class="workspace"><section class="map-card"><div class="map-head"><div><span class="live-dot"></span><b id="map-title">校园十字路口</b><span class="subtle" id="map-subtitle"></span></div><span class="map-tag" id="state-label">准备播放</span></div><div class="map-wrap"><canvas id="map" aria-label="SUMO 车辆轨迹和交通信号回放"></canvas><div class="compass"><b>N</b><span>↑</span></div><div class="map-note"><span class="dot teal"></span>正常行驶 <span class="dot amber"></span>低速 / 停车</div><div class="zoom"><button id="zoom-out" aria-label="缩小路口视图">−</button><button id="reset-view" aria-label="恢复视角">复位</button><button id="zoom-in" aria-label="放大路口视图">＋</button></div><div class="map-caption">拖动画面 / 滚轮缩放 · 景观为示意</div></div>
</section>
<aside><div id="demo"><div class="segments panel-tabs"><button id="current-tab" class="active">当前路况</button><button id="results-tab">整段结果</button></div><div id="current"><div class="metric-grid"><div class="metric"><span>进口排队</span><div><strong id="queue">0</strong><small>辆</small></div></div><div class="metric"><span>已完成行程</span><div><strong id="completed">0</strong><small>辆</small></div></div><div class="metric wide"><span>当前平均车速</span><div><strong id="avg-speed">—</strong><small>km/h</small><svg viewBox="0 0 140 36" aria-hidden="true"><path id="spark" d="M0 30 L140 30"/></svg></div></div></div>
<section class="signal-panel"><div class="panel-title">信号与排队 <span id="phase-label">南北放行</span></div></section>
<section class="queue-panel"><div class="panel-title">各方向排队 <span>辆</span></div><div id="direction-queues"></div></section>
<section class="strategy-note"><span class="note-symbol">↗</span><div><b id="policy-title">固定配时</b><p id="policy-note"></p><p id="last-action"></p></div></section>
</div><section class="bottom-row" id="results" hidden><div><h2>整段回放结果</h2><p id="run-description"></p><p>完整记录统计，不随播放进度变化。</p></div><div class="result"><span>整段回放 · 平均等待＋入网延迟</span><strong id="final-wait">—<small>秒</small></strong></div><div class="result"><span>整段回放 · 行程完成率</span><strong id="completion-rate">—</strong></div></section>
</div><section id="learning" class="learning" hidden>
<div class="learning-heading"><div><h2 id="decision-title"></h2></div></div>
<div class="learning-tabs segments"><button data-learning="0" class="active">状态</button><button data-learning="1">动作</button><button data-learning="2">奖励</button></div><div class="learning-grid">
<article class="learning-card"><h3>观察状态 <button class="help" data-concept="state" aria-label="什么是状态">?</button></h3><table><thead><tr><th>进口</th><th>前 / 后排队</th><th>决策前密度</th></tr></thead><tbody id="state-rows"></tbody></table><button id="vector-open" class="text-button">查看状态向量 ↗</button></article>
<article class="learning-card"><h3>选择与执行 <button class="help" data-concept="action" aria-label="什么是动作">?</button></h3><div class="action-flow"><span>策略请求</span><strong id="requested-action"></strong><span>实际执行</span><strong id="executed-action"></strong><span>实际执行</span></div><p class="callout" id="action-reason"></p></article>
<article class="learning-card"><h3>环境反馈 <button class="help" data-concept="reward" aria-label="什么是奖励">?</button></h3><div class="reward-number" id="reward-total"></div><p id="reward-scope" class="muted"></p><div id="reward-terms"></div><p class="callout" id="reward-formula"></p></article>
</div>
</section></aside></div>
<div class="playback"><div class="progress-row"><span id="time">00:00</span><input id="timeline" type="range" min="0" max="300" step="0.1" value="0" aria-label="回放进度"><span id="duration">05:00</span></div><div class="playback-bottom"><div class="transport"><button id="restart" class="icon-button" aria-label="从头播放">↺</button><button id="play" class="play-button">▶ 播放回放</button><label class="speed-label" for="speed">速度</label><select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="3">3×</option><option value="5">5×</option></select></div><span class="play-hint">空格 暂停 / 播放</span></div><div class="step-controls" id="step-controls" hidden><button class="secondary" id="previous-step">← 上一步</button><span id="step-position"></span><button class="play-button" id="next-step">下一步 →</button></div></div></main>
<dialog id="guide-dialog"><div class="dialog-head"><h2>使用说明</h2><button data-close="guide-dialog">关闭</button></div><div id="guide-pages"></div><button id="guide-learn" class="play-button">进入学习模式</button></dialog>
<dialog id="info-dialog"><div class="dialog-head"><h2>实验信息</h2><button data-close="info-dialog">关闭</button></div><div id="experiment-info"></div></dialog>
<dialog id="vector-dialog"><div class="dialog-head"><h2>状态向量 · 前 → 后</h2><button data-close="vector-dialog">关闭</button></div><div id="vectors"></div></dialog>
<dialog id="concept-dialog"><div class="dialog-head"><h2 id="concept-title"></h2><button class="secondary" data-close="concept-dialog">关闭</button></div><p id="concept-body"></p></dialog>
<div id="notice" role="status" hidden></div><div id="error" role="alert" hidden></div><script src="recordings.js"></script><script src="scripts/loader.js"></script><script src="scripts/pagination.js"></script><script src="scripts/renderer.js"></script><script src="scripts/labels.js"></script><script src="scripts/learning.js"></script><script src="scripts/app.js"></script></body></html>
